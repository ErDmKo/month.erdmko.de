<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#dce7f5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d8e2f0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa34f"/>
      <stop offset="100%" stop-color="#f16d20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#7a8ba6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="452" y="122" width="120" height="90" rx="22" fill="#b9c7d9"/>
    <rect x="428" y="196" width="168" height="84" rx="28" fill="#e3ebf5"/>

    <rect x="310" y="250" width="404" height="620" rx="130" fill="url(#glass)" stroke="#aebed2" stroke-width="8"/>

    <clipPath id="bottleClip">
      <rect x="322" y="262" width="380" height="596" rx="120"/>
    </clipPath>

    <g clip-path="url(#bottleClip)">
      <rect x="322" y="520" width="380" height="338" fill="url(#liquid)"/>
      <ellipse cx="512" cy="520" rx="190" ry="20" fill="#ffb26a" opacity="0.85"/>
      <circle cx="420" cy="612" r="10" fill="#ffd1a1" opacity="0.8"/>
      <circle cx="560" cy="700" r="8" fill="#ffd1a1" opacity="0.7"/>
      <circle cx="500" cy="780" r="12" fill="#ffd1a1" opacity="0.75"/>
    </g>

    <rect x="354" y="410" width="316" height="136" rx="24" fill="#fffaf0" stroke="#e2d5bf" stroke-width="5"/>
    <text x="512" y="468" text-anchor="middle" font-family="Verdana, sans-serif" font-size="46" font-weight="700" fill="#6f4b1f">LIQUID</text>
    <text x="512" y="514" text-anchor="middle" font-family="Verdana, sans-serif" font-size="44" font-weight="700" fill="#6f4b1f">FOOD</text>

    <rect x="372" y="310" width="40" height="510" rx="20" fill="#ffffff" opacity="0.45"/>
    <rect x="626" y="330" width="18" height="450" rx="9" fill="#ffffff" opacity="0.22"/>
  </g>
</svg>
