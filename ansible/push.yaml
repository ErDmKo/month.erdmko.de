---
- hosts: web
  name: push image 
  vars:
    install_dirr: '/opt/month'
    app_name: 'my_app'
    image_name: 'what_amonth'
  tasks:
  - name: Configure docker daemon log rotation
    ansible.builtin.copy:
      dest: /etc/docker/daemon.json
      mode: "0644"
      content: |
        {
          "log-driver": "json-file",
          "log-opts": {
            "max-size": "10m",
            "max-file": "5"
          }
        }
    notify: Restart docker daemon
  - name: directory exist
    ansible.builtin.file:
      path: "{{ install_dirr }}"
      state: directory
  - name: push image
    ansible.builtin.copy:
      src: './../image.tar'
      dest: '{{ install_dirr }}'
  - name: Copy Compose deployment configuration
    ansible.builtin.copy:
      src: ../docker-compose.yaml
      dest: '{{ install_dirr }}/docker-compose.yaml'
      mode: "0644"
  - name: Write Compose environment
    ansible.builtin.copy:
      dest: '{{ install_dirr }}/.env'
      mode: "0600"
      content: |
        VOICE_PUBLIC_IP={{ voice_public_ip }}
        VOICE_RTP_PORT_MIN={{ voice_rtp_port_min }}
        VOICE_RTP_PORT_MAX={{ voice_rtp_port_max }}
  - name: Stop docker container
    ansible.builtin.shell: |
      docker stop {{ app_name }} || true
  - name: Remove old container
    ansible.builtin.shell: |
      docker rm {{ app_name }} || true
  - name: Remove old image
    ansible.builtin.shell: docker rmi {{ image_name }} || true
  - name: Load image to docker
    ansible.builtin.shell: docker load --input image.tar
    args:
      chdir: "{{ install_dirr }}"
  - name: Start Compose stack
    ansible.builtin.command: docker compose up --detach
    args:
      chdir: "{{ install_dirr }}"
  handlers:
  - name: Restart docker daemon
    ansible.builtin.systemd:
      name: docker
      state: restarted
