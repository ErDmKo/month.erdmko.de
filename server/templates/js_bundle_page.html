{% extends "inner.html" %}
{% block title %}{{ game_name }} game{% endblock title %}
{% block desc %}Simple JS {{ game_name }} game{% endblock desc %}
{% block head %}
<script async src="/static/js/{{ bundle_name }}-bundle.js?v={{ asset_version | default(value="1") }}"></script>
{% endblock head %}
{% block inner_content %}
<h1>{{ game_name }}</h1>
  <div {% if result %}title="{{ result }}"{% endif %} class="js-{{ bundle_name }}">loading</div>
{% endblock inner_content %}
