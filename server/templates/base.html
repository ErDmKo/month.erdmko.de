<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}ErDmKo home page{% endblock title %}</title>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        {% block analytics_preconnect %}<link rel="preconnect" href="https://mc.yandex.ru" crossorigin>{% endblock analytics_preconnect %}
        <meta name="google-site-verification" content="TFGFP-50qNSslG_4Sv7LHxG5vJdLtVeuh6zvZ2hAV1k" />
        <meta name="robots" content="{% block robots %}index, follow, max-image-preview:large{% endblock robots %}"/>
        <link rel="canonical" href="{% block canonical %}{{ canonical_url | default(value="https://erdmko.dev/") | safe }}{% endblock canonical %}"/>
        <meta name="twitter:card" content="summary_large_image"/>
        <meta name="twitter:title" content="{% block twitter_title %}ErDmKo — Online Tools, Games &amp; WebRTC Chat{% endblock twitter_title %}"/>
        <meta name="twitter:image" content="{% block twitter_image %}{{ site_url | default(value="https://erdmko.dev") | safe }}/static/img/avatar@2x.jpg{% endblock twitter_image %}"/>
        <meta name="twitter:image:alt" content="{% block twitter_image_alt %}ErDmKo home page{% endblock twitter_image_alt %}"/>
        <meta name="twitter:description" content="{% block twitter_desc %}Developer tools, browser games, and instant WebRTC voice &amp; chat rooms by Dmitry Eroshenko (ErDmKo).{% endblock twitter_desc %}"/>
        <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}"/>
        <meta property="og:site_name" content="ErDmKo"/>
        <meta property="og:url" content="{{ canonical_url | default(value="https://erdmko.dev/") | safe }}"/>
        <meta property="og:description" content="{% block og_desc %}Developer tools, browser games, and instant WebRTC voice &amp; chat rooms by Dmitry Eroshenko (ErDmKo).{% endblock og_desc %}">
        <meta property="og:image" content="{% block og_image %}{{ site_url | default(value="https://erdmko.dev") | safe }}/static/img/avatar@2x.jpg{% endblock og_image %}"/>
        <meta property="og:title" content="{% block og_title %}ErDmKo — Online Tools, Games &amp; WebRTC Chat{% endblock og_title %}" />
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css?family=Poiret+One|Roboto&subset=latin,cyrillic&display=swap"/>
        <link type="image/x-icon" rel="shortcut icon" href="/static/favicon.ico">
        <link 
            rel="apple-touch-icon"
            sizes="180x180"
            href="/static/img/apple-touch-icon.png"
        />
        <link 
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/static/img/favicon-32x32.png"
        />
        <link 
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/static/img/favicon-16x16.png"
        />
        <link 
            rel="manifest"
            href="/static/site.webmanifest"
        />
        <link 
            rel="mask-icon"
            href="/static/img/safari-pinned-tab.svg"
            color="#5bbad5"
        />
        <link 
            rel="stylesheet"
            href="/static/css/minified/style.css"/>
        <meta name="msapplication-TileColor" content="#da532c">
        <meta name="theme-color" content="#ffffff">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="description" content="{% block desc %}Main page{% endblock desc %}"/>
        <link
          media="print"
          onload="this.onload=null;this.removeAttribute('media');"
          href="https://fonts.googleapis.com/css?family=Poiret+One|Roboto&subset=latin,cyrillic&display=swap"
          rel="stylesheet">
        {% block head %}{% endblock head %}
    </head>
    <body>
        <main>{% block content %}{% endblock content %}</main>
        {% block analytics %}
        <script async src="/static/js/mc.js"></script>
        <script>
          window.ym = (...args) => {
            window.ym.a = (window.ym.a || []);
            window.ym.a.push(args);
          };
          ym(64378813, "init");
        </script>
        {% endblock analytics %}
    </body>
</html>
