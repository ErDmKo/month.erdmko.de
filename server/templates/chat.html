{% extends "inner.html" %}
{% block title %}Chat room {{ room_id }}{% endblock title %}
{% block desc %}Simple room chat{% endblock desc %}
{% block head %}
<script async src="/static/js/{{ bundle_name }}-bundle.js"></script>
{% endblock head %}
{% block inner_content %}
<section class="{{ css["chat-page"] }}">
    <h1 class="{{ css.chat__title }}">Chat room: {{ room_id }}</h1>
    <div class="{{ css.chat }} js-chat" data-room-id="{{ room_id }}"></div>
</section>
{% endblock inner_content %}
