[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "=4.9.0"
log = "0.4.17"
actix-files = "=0.6.6"
rand = "0.8.5"
base64 = "0.13.0"
chrono = "0.4.23"
slug = "0.1.4"
env_logger="0.10.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.21.0"
actix-web-actors = "=4.2.0"
actix = "=0.13.5"
serde_json = "1.0.114"
actix-multipart = "=0.6.1"
futures-util = "0.3.30"
actix-web-grants = "=4.1.0"
prost = "=0.12.6"
prost-types = "=0.12.6"
protoc-gen-prost = "=0.3.1"
indexmap = "=2.2.3"
time = "=0.3.36"

[build-dependencies]
prost-build = "0.12"

[dependencies.awc] 
version = "3.5.1"
features = ["rustls"]


[dependencies.rusqlite]
version= "0.28.0"
features = ["bundled", "blob"]

[dependencies.serde]
version = "1.0.137"
features = ["derive"]

[dependencies.tera]
version = "1.15.0"
default-features = false
